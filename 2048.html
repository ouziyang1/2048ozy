<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23edc22e'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='700' text-anchor='middle' fill='%23f9f6f2' font-family='Arial, sans-serif'%3E2%3C/text%3E%3C/svg%3E">
<style>
  :root { --gap: 12px; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf8ef;
    color: #776e65;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
    overflow: auto;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .wrap { width: min(92vw, 480px); }

  /* ===== 顶部：标题 + 计分 ===== */
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
  h1 { font-size: clamp(40px, 12vw, 60px); font-weight: 900; line-height: 1; letter-spacing: 1px; }
  .hud { display: flex; gap: 8px; }
  .score-box {
    background: #bbada0; border-radius: 6px; padding: 6px 14px;
    min-width: 76px; text-align: center;
  }
  .score-box .label { font-size: 11px; color: #eee4da; font-weight: 700; letter-spacing: 1px; }
  .score-box .value { font-size: 22px; color: #fff; font-weight: 800; line-height: 1.3; }

  /* ===== 操作区 ===== */
  .controls { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; }
  .btn {
    background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
    padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: #9f8b77; }
  .btn:active { transform: scale(.96); }
  .btn.disabled { opacity: .4; pointer-events: none; }
  .btn-ghost { background: transparent; color: #8f7a66; border: 2px solid #8f7a66; }
  .btn-ghost:hover { background: rgba(143, 122, 102, .08); }
  .tip { font-size: 12.5px; color: #a59a8d; margin-bottom: 12px; }

  /* ===== 棋盘 ===== */
  .board {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    background: #bbada0; border-radius: 12px; touch-action: none;
  }
  .bg-layer, .tile-layer { position: absolute; inset: 0; }
  .bg-cell { position: absolute; width: 25%; height: 25%; }
  .bg-cell i {
    position: absolute; inset: calc(var(--gap) / 2);
    background: rgba(238, 228, 218, .35); border-radius: 6px;
  }
  .tile {
    position: absolute; top: 0; left: 0; width: 25%; height: 25%;
    transition: transform .13s ease-in-out; will-change: transform;
  }
  .tile-layer.no-anim .tile { transition: none; }
  .tile-inner {
    position: absolute; inset: calc(var(--gap) / 2); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #776e65; background: #eee4da;
  }
  .v2    { background: #eee4da; color: #776e65; }
  .v4    { background: #ede0c8; color: #776e65; }
  .v8    { background: #f2b179; color: #f9f6f2; }
  .v16   { background: #f59563; color: #f9f6f2; }
  .v32   { background: #f67c5f; color: #f9f6f2; }
  .v64   { background: #f65e3b; color: #f9f6f2; }
  .v128  { background: #edcf72; color: #f9f6f2; border-radius: 9px; }
  .v256  { background: #edcc61; color: #f9f6f2; }
  .v512  { background: #edc850; color: #f9f6f2; }
  .v1024 { background: #edc53f; color: #f9f6f2; }
  .v2048 { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243, 215, 116, .25); }
  .vsup  { background: #3c3a32; color: #f9f6f2; }

  @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .tile-inner.new { animation: appear .18s ease; }
  .tile-inner.pop { animation: pop .18s ease; }

  /* ===== 结束 / 胜利遮罩 ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(238, 228, 218, .72); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: opacity .2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .ov-title { font-size: 38px; font-weight: 900; }
  .ov-msg { font-size: 15px; color: #8a7f72; text-align: center; padding: 0 20px; }
  .ov-btns { display: flex; gap: 10px; margin-top: 6px; }

  @media (max-width: 420px) { :root { --gap: 9px; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>2048</h1>
    <div class="hud">
      <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    </div>
  </header>

  <div class="controls">
    <button class="btn btn-ghost disabled" id="undoBtn">撤销</button>
    <button class="btn" id="newBtn">新游戏</button>
  </div>
  <p class="tip">方向键 / WASD / 滑动屏幕移动方块，相同的数字相撞会合并。</p>

  <div class="board" id="board">
    <div class="bg-layer" id="bgLayer"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="overlay hidden" id="overlay">
      <div class="ov-title" id="ovTitle"></div>
      <div class="ov-msg" id="ovMsg"></div>
      <div class="ov-btns">
        <button class="btn btn-primary" id="ovBtn1"></button>
        <button class="btn btn-ghost" id="ovBtn2">重新开始</button>
      </div>
    </div>
  </div>
</main>

<script>
'use strict';

/* ===== 常量与状态 ===== */
const SIZE = 4;
const CELLS = SIZE * SIZE;
const DIRS = { left: [0,1,2,3], right: [3,2,1,0], up: [0,4,8,12], down: [12,8,4,0] };

const boardEl = document.getElementById('board');
const layerEl = document.getElementById('tileLayer');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const undoBtn = document.getElementById('undoBtn');
const newBtn = document.getElementById('newBtn');
const overlayEl = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg = document.getElementById('ovMsg');
const ovBtn1 = document.getElementById('ovBtn1');
const ovBtn2 = document.getElementById('ovBtn2');

let slots = Array(CELLS).fill(null);   // 每个格子：{ id, value } 或 null
let score = 0;
let best = parseInt(localStorage.getItem('best2048') || '0', 10) || 0;
let tileSeq = 0;                       // 方块唯一 id 递增
let gameOver = false;
let wonFlag = false;                   // 是否已展示过胜利提示
let busy = false;                      // 动画期间锁定输入
let session = 0;                       // 重开时递增，用于作废旧动画回调
let history = [];                      // 撤销栈：{ slots, score }
const elmById = new Map();             // 方块 id -> DOM 元素

/* ===== 背景格 ===== */
const bg = document.getElementById('bgLayer');
for (let i = 0; i < CELLS; i++) {
  const c = document.createElement('div');
  c.className = 'bg-cell';
  c.style.transform = 'translate(' + (i % SIZE) * 100 + '%, ' + Math.floor(i / SIZE) * 100 + '%)';
  c.innerHTML = '<i></i>';
  bg.appendChild(c);
}

/* ===== 工具函数 ===== */
function ts() { return boardEl.clientWidth / 4; }
function idxOf(id) { return slots.findIndex(t => t && t.id === id); }

function positionEl(el, idx) {
  const r = Math.floor(idx / SIZE), c = idx % SIZE;
  el.style.transform = 'translate(' + c * 100 + '%, ' + r * 100 + '%)';
}

function setInner(inner, value) {
  inner.textContent = value;
  inner.className = 'tile-inner v' + (value <= 2048 ? value : 'sup');
  const len = String(value).length;
  const ratio = len <= 2 ? 0.55 : len === 3 ? 0.42 : len === 4 ? 0.33 : 0.26;
  inner.style.fontSize = (ratio * ts()) + 'px';
}

function tileEl(id, value) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.dataset.id = id;
  const inner = document.createElement('div');
  inner.className = 'tile-inner';
  el.appendChild(inner);
  setInner(inner, value);
  elmById.set(id, el);
  return el;
}

function addRandomTile() {
  const empty = [];
  slots.forEach((t, i) => { if (!t) empty.push(i); });
  if (!empty.length) return null;
  const idx = empty[Math.floor(Math.random() * empty.length)];
  const value = Math.random() < 0.9 ? 2 : 4;
  slots[idx] = { id: ++tileSeq, value };
  return idx;
}

function canMove() {
  for (let i = 0; i < CELLS; i++) {
    if (!slots[i]) return true;
    const r = Math.floor(i / SIZE), c = i % SIZE;
    if (c + 1 < SIZE && slots[i + 1] && slots[i].value === slots[i + 1].value) return true;
    if (r + 1 < SIZE && slots[i + SIZE] && slots[i].value === slots[i + SIZE].value) return true;
  }
  return false;
}

function updateHud() {
  scoreEl.textContent = score;
  if (score > best) { best = score; localStorage.setItem('best2048', best); }
  bestEl.textContent = best;
  undoBtn.classList.toggle('disabled', history.length === 0);
}

/* ===== 渲染 ===== */
function renderAll() {
  layerEl.classList.add('no-anim');
  layerEl.innerHTML = '';
  elmById.clear();
  for (let i = 0; i < CELLS; i++) {
    if (slots[i]) {
      const el = tileEl(slots[i].id, slots[i].value);
      positionEl(el, i);
      layerEl.appendChild(el);
    }
  }
  void layerEl.offsetWidth;          // 强制重排后再恢复动画
  layerEl.classList.remove('no-anim');
  updateHud();
}

/* ===== 移动逻辑 ===== */
function computeMove(dir) {
  const order = DIRS[dir];
  const lines = [];
  for (let i = 0; i < SIZE; i++) {
    const base = (dir === 'left' || dir === 'right') ? i * SIZE : i;
    lines.push(order.map(o => base + o));
  }

  const slides = [];   // { id, from, to }  方块滑动
  const merges = [];   // { winnerId, loserId, to, value }  合并
  const newSlots = Array(CELLS).fill(null);
  let win = false;

  for (const line of lines) {
    const tiles = line.map(i => slots[i]).filter(Boolean);
    const result = [];
    for (const t of tiles) {
      const last = result[result.length - 1];
      if (last && !last.merged && last.value === t.value) {
        last.merged = true;
        last.value *= 2;
        last.fromIds.push(t.id);
      } else {
        result.push({ value: t.value, fromIds: [t.id], merged: false });
      }
    }
    for (let k = 0; k < result.length; k++) {
      const r = result[k];
      const to = line[k];
      if (r.fromIds.length === 1) {
        const id = r.fromIds[0];
        slides.push({ id, from: idxOf(id), to });
        newSlots[to] = { id, value: r.value };
      } else {
        const [a, b] = r.fromIds;
        const dist = id => {
          const i = idxOf(id);
          return Math.abs(Math.floor(i / SIZE) - Math.floor(to / SIZE))
               + Math.abs((i % SIZE) - (to % SIZE));
        };
        const winnerId = dist(a) <= dist(b) ? a : b;
        const loserId = winnerId === a ? b : a;
        slides.push({ id: a, from: idxOf(a), to });
        slides.push({ id: b, from: idxOf(b), to });
        merges.push({ winnerId, loserId, to, value: r.value });
        newSlots[to] = { id: winnerId, value: r.value };
        if (r.value === 2048) win = true;
      }
    }
  }

  const moved = slides.some(s => s.from !== s.to) || merges.length > 0;
  if (!moved) return null;
  return { slots: newSlots, slides, merges, win };
}

function move(dir) {
  if (gameOver || busy) return;
  if (!overlayEl.classList.contains('hidden')) return;  // 遮罩显示期间不响应键盘/滑动
  const res = computeMove(dir);
  if (!res) return;
  history.push({ slots: slots.map(t => (t ? { ...t } : null)), score });
  const mySession = session;
  slots = res.slots;
  score += res.merges.reduce((s, m) => s + m.value, 0);
  busy = true;

  for (const s of res.slides) {
    const el = elmById.get(s.id);
    if (el) positionEl(el, s.to);
  }

  setTimeout(() => {
    if (mySession !== session) return;
    for (const m of res.merges) {
      const w = elmById.get(m.winnerId);
      const l = elmById.get(m.loserId);
      if (l) l.remove();
      if (w) {
        const inner = w.querySelector('.tile-inner');
        setInner(inner, m.value);
        inner.classList.remove('pop');
        void inner.offsetWidth;
        inner.classList.add('pop');
      }
    }
    const ni = addRandomTile();
    if (ni != null) {
      const el = tileEl(slots[ni].id, slots[ni].value);
      positionEl(el, ni);
      el.querySelector('.tile-inner').classList.add('new');
      layerEl.appendChild(el);
    }
    updateHud();
    busy = false;
    if (!canMove()) showOverlay('gameover');
    else if (res.win && !wonFlag) { wonFlag = true; showOverlay('win'); }
  }, 150);
}

/* ===== 遮罩 / 重开 / 撤销 ===== */
function showOverlay(kind) {
  if (kind === 'win') {
    ovTitle.textContent = '你赢了！';
    ovMsg.textContent = '成功合成 2048，可以继续挑战更高分数。';
    ovBtn1.textContent = '继续游戏';
    ovBtn1.dataset.mode = 'continue';
    ovBtn2.style.display = '';
  } else {
    ovTitle.textContent = '游戏结束';
    ovMsg.textContent = '没有可移动的方块了。';
    ovBtn1.textContent = '重新开始';
    ovBtn1.dataset.mode = 'restart';
    ovBtn2.style.display = 'none';
  }
  overlayEl.classList.remove('hidden');
}
function hideOverlay() { overlayEl.classList.add('hidden'); }

function restart() {
  session++;
  history = [];
  score = 0;
  gameOver = false;
  wonFlag = false;
  busy = false;
  slots = Array(CELLS).fill(null);
  addRandomTile();
  addRandomTile();
  hideOverlay();
  renderAll();
}

function undo() {
  if (busy || !history.length) return;
  const h = history.pop();
  slots = h.slots;
  score = h.score;
  gameOver = false;
  wonFlag = false;
  hideOverlay();
  renderAll();
}

ovBtn1.addEventListener('click', () => {
  if (ovBtn1.dataset.mode === 'continue') hideOverlay();
  else restart();
});
ovBtn2.addEventListener('click', restart);
newBtn.addEventListener('click', restart);
undoBtn.addEventListener('click', undo);

/* ===== 键盘控制 ===== */
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', a: 'left', s: 'down', d: 'right',
  W: 'up', A: 'left', S: 'down', D: 'right'
};
window.addEventListener('keydown', e => {
  const dir = KEYMAP[e.key];
  if (dir) { e.preventDefault(); move(dir); }
});

/* ===== 触屏滑动 ===== */
let tx = null, ty = null;
boardEl.addEventListener('touchstart', e => {
  const t = e.touches[0];
  tx = t.clientX; ty = t.clientY;
}, { passive: true });
boardEl.addEventListener('touchend', e => {
  if (tx == null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  tx = null; ty = null;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 24) return;
  move(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}, { passive: true });

/* ===== 窗口尺寸变化时刷新字号 ===== */
window.addEventListener('resize', () => {
  layerEl.querySelectorAll('.tile-inner').forEach(el => {
    setInner(el, parseInt(el.textContent, 10) || 2);
  });
});

/* ===== 启动 ===== */
restart();
</script>
</body>
</html>
